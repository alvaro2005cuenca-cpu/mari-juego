<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mk.js · 2 jugadores</title>
    <script src="src/movement.js"></script>
    <script src="src/mk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <link rel="stylesheet" href="styles/styles.css" />
    <style>
      body{background:#000;text-align:center;font-family:Verdana;color:#eee;margin:0;}
      .topbar{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:10px auto;}
      .topbar a,.topbar span{color:#fde047;text-decoration:none;font-weight:bold;}
      .topbar a{background:#222;padding:8px 12px;border-radius:8px;}
      .arena-wrap{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;}
      #parent{transform-origin:top center;}
      .controls{max-width:760px;margin:16px auto;color:#ddd;font-size:13px;line-height:1.7;text-align:left;}
      .controls b{color:#fff;}
      .col{display:inline-block;vertical-align:top;width:48%;}
      /* Menú */
      .menu{max-width:460px;margin:40px auto;background:#14121c;border:2px solid #333;border-radius:20px;padding:26px;}
      .menu h1{font-size:22px;margin:0 0 4px;color:#fff;}
      .menu p.sub{color:#9aa;font-size:13px;margin:0 0 20px;}
      .mbtn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:14px;font-weight:bold;font-size:15px;color:#fff;cursor:pointer;text-align:left;}
      .mbtn small{display:block;font-weight:normal;opacity:.85;font-size:11px;}
      .mbtn.blue{background:linear-gradient(90deg,#2563eb,#4f46e5);}
      .mbtn.green{background:linear-gradient(90deg,#059669,#0d9488);}
      .mbtn.gray{background:#2a2a33;}
      .code{font-size:26px;letter-spacing:6px;font-weight:bold;color:#fde047;background:#000;padding:10px 16px;border-radius:12px;display:inline-block;}
      .inp{width:100%;text-align:center;font-size:24px;letter-spacing:6px;font-weight:bold;text-transform:uppercase;padding:12px;border-radius:12px;border:none;background:#000;color:#34d399;margin-bottom:10px;}
      .mini{color:#9aa;font-size:13px;margin-top:10px;cursor:pointer;}
      [hidden]{display:none!important;}
    </style>
</head>
<body>

    <!-- MENÚ -->
    <div id="mk-start" class="menu">
      <h1>🥋 mk.js · Sub-Zero vs Kano</h1>
      <p class="sub">Juego de lucha para 2 jugadores</p>
      <button class="mbtn blue" id="b-host">👑 Crear sala online<small>Tú invitas · juegas desde tu dispositivo</small></button>
      <button class="mbtn green" id="b-join">🔑 Unirme a una sala<small>Con el código que te pasen</small></button>
      <button class="mbtn gray" id="b-local">🖥️ Mismo PC (2 jugadores)<small>Los dos en el mismo teclado</small></button>
      <div class="mini"><a href="../index.html" style="color:#fde047;">← Volver al menú de juegos</a></div>
    </div>

    <!-- NET -->
    <div id="mk-net" class="menu" hidden>
      <div id="net-host" hidden>
        <h1>Sala creada</h1>
        <p class="sub">Comparte este código con tu rival:</p>
        <div class="code" id="roomcode">----</div>
        <p id="host-status" style="color:#60a5fa;margin-top:16px;">Esperando a tu rival…</p>
      </div>
      <div id="net-join" hidden>
        <h1>Unirse a sala</h1>
        <p class="sub">Escribe el código:</p>
        <input id="joininput" class="inp" maxlength="6" placeholder="CÓDIGO">
        <button class="mbtn green" id="dojoin">Conectar</button>
        <p id="join-status" style="color:#34d399;"></p>
      </div>
      <div class="mini" id="net-back">← Volver</div>
    </div>

    <!-- JUEGO -->
    <div id="mk-game" hidden>
      <div class="topbar">
        <a href="#" id="to-menu">← Menú</a>
        <span id="game-title">mk.js · Sub-Zero vs Kano</span>
        <a href="#" onclick="location.reload();return false;">↻ Reiniciar</a>
      </div>
      <div class="arena-wrap">
        <div id="parent">
          <div id="utils">
            <div id="player1Name" class="playerName">Sub-Zero (J1)</div>
            <div id="player1LifeBar" class="lifebar"><div class="life" id="player1Life"></div></div>
            <div id="player2Name" class="playerName">Kano (J2)</div>
            <div id="player2LifeBar" class="lifebar"><div class="life" id="player2Life"></div></div>
          </div>
          <div id="arena"></div>
          <div id="loading"><span class="loadingLabel">Cargando…</span></div>
        </div>
      </div>
      <div class="controls" id="controls-box"></div>
    </div>

    <script>
    (function () {
      function $(id){ return document.getElementById(id); }
      function setLife(c,l){ c.style.width = l + '%'; }
      function show(id){ ['mk-start','mk-net','mk-game'].forEach(function(s){ $(s).hidden=(s!==id); }); }

      /* ---- Luces de vida (global para el modo online) ---- */
      window.__mkSetLives = function(l0,l1){ setLife($('player1Life'),l0); setLife($('player2Life'),l1); };

      /* =========================================================
         Controlador ONLINE (PeerJS) — añadido, NO modifica el juego
         Cada jugador controla SU luchador y envía sus movimientos.
         ========================================================= */
      mk.controllers.Online = function (options) {
        mk.controllers.Basic.call(this, options);
        this._myIndex = options.myIndex;
        this._conn = options.conn;
        this._isHost = (options.myIndex === 0);
      };
      mk.controllers.Online.prototype = new mk.controllers.Basic();
      mk.controllers.Online.prototype._initialize = function () {
        var self = this, pressed = {}, K = mk.controllers.keys;
        this._player = this._myIndex;
        var me = this.fighters[this._myIndex], remote = this.fighters[1 - this._myIndex];

        this._conn.on('data', function (d) {
          if (!d) return;
          if (d.t === 'move') { self._moveFighter(remote, d.m); }
          else if (d.t === 'life') { window.__mkSetLives(d.l0, d.l1); }
        });

        function upd() {
          var move = self._getMove(pressed, K, self._myIndex);
          if (move) {
            self._moveFighter(me, move);
            if (self.__last !== move) {
              self.__last = move;
              if (self._conn && self._conn.open) self._conn.send({ t: 'move', m: move });
            }
          }
        }
        document.addEventListener('keydown', function (e) {
          if ([32,37,38,39,40].indexOf(e.keyCode) >= 0) e.preventDefault();
          pressed[e.keyCode] = true; upd();
        }, false);
        document.addEventListener('keyup', function (e) { delete pressed[e.keyCode]; upd(); }, false);
      };

      /* ---- Opciones base del juego ---- */
      function baseOptions() {
        return {
          arena: { container: $('arena'), arena: mk.arenas.types.THRONE_ROOM },
          fighters: [{ name: 'Subzero' }, { name: 'Kano' }],
          callbacks: {
            attack: function (f, o, l) {
              // actualiza barras desde el estado de los luchadores
              var F = mk.game.fighters;
              setLife($('player1Life'), F[0].getLife());
              setLife($('player2Life'), F[1].getLife());
              // el anfitrión manda la vida autoritativa al rival
              if (ONLINE.on && ONLINE.isHost && ONLINE.conn && ONLINE.conn.open) {
                ONLINE.conn.send({ t: 'life', l0: F[0].getLife(), l1: F[1].getLife() });
              }
            }
          }
        };
      }
      function startGameUI() {
        $('loading').style.visibility = 'hidden';
        $('arena').style.visibility = 'visible';
        $('utils').style.visibility = 'visible';
        fit();
      }

      var ONLINE = { on:false, isHost:false, conn:null };
      var CTRL_LOCAL =
        '<div class="col"><b>🔵 Jugador 1 (Sub-Zero)</b><br>Mover: <b>G</b>/<b>J</b> · Saltar: <b>Y</b> · Agacharse: <b>H</b><br>Puño alto: <b>A</b> · Puño bajo: <b>S</b> · Patada baja: <b>D</b> · Patada alta: <b>F</b> · Bloquear: <b>Shift</b></div>'+
        '<div class="col"><b>🔴 Jugador 2 (Kano)</b><br>Mover: <b>←</b>/<b>→</b> · Saltar: <b>↑</b> · Agacharse: <b>↓</b><br>Puño alto: <b>P</b> · Puño bajo: <b>[</b> · Patada baja: <b>]</b> · Patada alta: <b>\\</b> · Bloquear: <b>Ctrl</b></div>';
      var CTRL_ONLINE =
        '<div style="text-align:center"><b>Tus controles</b><br>Mover: <b>←</b>/<b>→</b> · Saltar: <b>↑</b> · Agacharse: <b>↓</b><br>Puño alto: <b>A</b> · Puño bajo: <b>S</b> · Patada baja: <b>D</b> · Patada alta: <b>F</b> · Bloquear: <b>Shift</b></div>';

      /* ---- Arranques ---- */
      function startLocal() {
        ONLINE.on = false;
        $('controls-box').innerHTML = CTRL_LOCAL;
        $('game-title').textContent = 'mk.js · Mismo PC';
        show('mk-game');
        var opts = baseOptions(); opts.gameType = 'multiplayer';
        mk.start(opts).ready(startGameUI);
      }
      function startOnline(conn, myIndex) {
        ONLINE.on = true; ONLINE.isHost = (myIndex === 0); ONLINE.conn = conn;
        $('controls-box').innerHTML = CTRL_ONLINE;
        $('game-title').textContent = 'mk.js · Online — eres ' + (myIndex===0 ? 'Sub-Zero (J1)' : 'Kano (J2)');
        show('mk-game');
        var opts = baseOptions(); opts.myIndex = myIndex; opts.conn = conn;
        mk.game = new mk.controllers.Online(opts);
        var p = new mk.Promise();
        mk.game.init(p);
        p.ready(startGameUI);
      }

      /* ---- Red (PeerJS) ---- */
      var peer=null, conn=null;
      function code(){ return Math.random().toString(36).slice(2,7).toUpperCase(); }
      function hostConn(c){ conn=c; c.on('open', function(){ startOnline(c, 0); }); }

      $('b-local').onclick = startLocal;
      $('b-host').onclick = function () {
        show('mk-net'); $('net-host').hidden=false; $('net-join').hidden=true;
        var rc = code(); $('roomcode').textContent = rc;
        peer = new Peer('mkjs-'+rc);
        peer.on('connection', function(c){ $('host-status').textContent='¡Conectado! Empezando…'; hostConn(c); });
        peer.on('error', function(e){ $('host-status').textContent='Error: '+e.type; });
      };
      $('b-join').onclick = function () {
        show('mk-net'); $('net-host').hidden=true; $('net-join').hidden=false;
      };
      $('dojoin').onclick = function () {
        var rc = $('joininput').value.trim().toUpperCase();
        if (rc.length < 4){ $('join-status').textContent='Código no válido'; return; }
        $('join-status').textContent='Conectando…';
        peer = new Peer();
        peer.on('open', function(){
          var c = peer.connect('mkjs-'+rc, { reliable:true });
          c.on('open', function(){ $('join-status').textContent='¡Conectado!'; startOnline(c, 1); });
        });
        peer.on('error', function(e){ $('join-status').textContent='No se pudo: '+e.type; });
      };
      $('net-back').onclick = function(){ if(peer)peer.destroy(); show('mk-start'); };
      $('to-menu').onclick = function(e){ e.preventDefault(); location.reload(); };

      /* ---- Escalado (grande y centrado) ---- */
      window.fit = function () {
        var vw = window.innerWidth, vh = window.innerHeight;
        var scale = Math.min((vw - 30) / 600, (vh - 230) / 400, 2.4);
        if (scale < 0.6) scale = 0.6;
        $('parent').style.transform = 'scale(' + scale + ')';
        document.querySelector('.arena-wrap').style.height = (400 * scale + 8) + 'px';
      };
      window.addEventListener('resize', function(){ if(!$('mk-game').hidden) fit(); });
    }());
    </script>
</body>
</html>
